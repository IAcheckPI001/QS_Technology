# Dữ liệu biên soạn: bảng chọn bộ điều khiển "Motion Controller – Selection table" (catalog trang 6–7).
# Chép từ ảnh trang (Claude, 2026-11-14): pipeline gộp/lệch ô và mất toàn bộ icon ✓/✗ (I-49).
# Quy ước giá trị:
#   true / false = icon ✓ / ✗;  option = "(Option)";  chuỗi = chữ trong ô.
#   Giá trị đơn  = mọi giao tiếp của model; map {pulse_train|ethercat|mechatrolink: …} = cột con theo giao tiếp.
#   Cột "ASTRO 6AV/H" của trang 7 dùng chung cho 6AV và 6AH → ghi lặp ở hai model, chỉ kích thước khác.
#   override: giá trị đã chốt khác ô trong bảng (mã quyết định C-xx); ô gốc giữ ở `table_value`.
#   column: tên cột model in trên trang (6AV, 6AH chung cột "ASTRO 6AV/H").
# verified: true = người duyệt đã xác nhận (Toma 2026-11-14), theo từng hàng.
schema_version: 1
source: {pdf: QS_Product_Catalogue.pdf, sha256: ffff897f68d8a64ac6adf63d55d1ec47d89cabe05056b32744f5b8ca072aabf1}

