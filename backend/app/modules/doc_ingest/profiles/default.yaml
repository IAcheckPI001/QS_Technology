# Profile mặc định: hoàn toàn chung, không có mẫu mã hay cụm từ riêng của hãng.
# Luật T-05 chỉ dùng trùng header + hình dạng token; T-12 không parse mã (không có prefix).
name: default
vocabulary_file: registry_snapshot.json
code_patterns: []
param_prefixes: []
# T-12 trên text: prefix -> regex số chữ số; rỗng = không quét mã trong text.
param_text_patterns: {}
applicability_lexicon:
  - {phrase: "not available on", status: not_available}
  - {phrase: "not available for", status: not_available}
  - {phrase: "not supported on", status: not_available}
  - {phrase: "not supported by", status: not_available}
  - {phrase: "only available on", status: available_only}
  - {phrase: "available only on", status: available_only}
  - {phrase: "available on", status: available_only}
  - {phrase: "only for", status: available_only}
  - {phrase: "không áp dụng cho", status: not_available}
  - {phrase: "không áp dụng với", status: not_available}
  - {phrase: "không hỗ trợ trên", status: not_available}
  - {phrase: "không có trên", status: not_available}
  - {phrase: "chỉ áp dụng cho", status: available_only}
  - {phrase: "chỉ áp dụng với", status: available_only}
  - {phrase: "chỉ có trên", status: available_only}
caption_keywords: ["Figure", "Fig.", "Hình", "Table", "Bảng"]
# T-11: từ khóa caption bảng; từ khóa còn lại của caption_keywords là caption hình.
table_caption_keywords: ["Table", "Bảng"]
section_keywords: ["PART", "CHAPTER", "Phần", "Chương"]
# T-17 (d): regex header/footer cho đoạn trang quá ngắn để luật lặp nhận ra; mặc định không có.
furniture_patterns: []
list_glyphs: ["o", "-", "•", "▪"]
# T-20: tiêu đề khung hướng dẫn/ảnh minh họa và dòng model áp dụng (khớp toàn chuỗi): không tính là câu
# khi quyết định picture có phải khung chữ.
frame_label_patterns:
  - '(?i)(description images?|instructions?|hình minh họa|hướng dẫn)\s*:?'
  - '(?i)models?\s*:.*'
# T-20: dòng model của khung. Tiêu đề khung + dòng model liền sau, hoặc dòng model ngay trên hình, mà Docling
# để ngoài picture → chữ của hình (không vào text thân, không cắt chuỗi bước).
frame_model_patterns:
  - '(?i)models?\s*:.*'
# T-16: tiêu đề mục lục đứng ngay trước phần tử mục lục.
toc_title_patterns:
  - '(?i)(table of )?contents?\s*:?'
  - '(?i)mục lục\s*:?'
thresholds:
  continuation_tol: 0.15
  shape_majority: 0.6
  shape_min_rows: 3
  row_gap_factor: 1.5
  max_range_len: 64
  furniture_band: 0.12
  furniture_min_pages: 3
  figure_label_gap: 12.0
  figure_label_max_tokens: 4
  frame_sentence_words: 5
  frame_text_min_ratio: 0.5
  crop_bitmap_min: 0.5
  crop_vector_margin: 36.0
  crop_padding: 12.0
  screenshot_bitmap_min: 0.8
  watermark_cover_min: 0.9
  duplicate_iou_min: 0.9
  list_indent_min: 18.0
# Chunk builder (BL-16, contract C2 §5, §6, §8). Regex khớp không phân biệt hoa thường qua (?i).
chunking:
  child_soft_max: 1200
  parent_max: 2500
  figure_text_max: 600
  embed_max_tokens: 800
  embed_enrich_reserve: 150
  max_keywords: 40
  step_patterns: ['(?i)^\s*(step|stage|bước)\s*\(?\d+']
  # I-39: khối dài vượt giới hạn chỉ chia ở đầu các phần này; phần dẫn ≤ block_lead_max lặp ở mọi phần sau.
  block_part_patterns: ['(?i)^\s*(case|example|ví dụ|trường hợp)\s*\d+\b']
  block_lead_max: 300
  # I-42: câu dẫn ngắn ngay trước "Step 1" (≤ ngưỡng) thuộc thủ tục mở bằng bước đó.
  procedure_lead_max: 160
  procedure_title_patterns:
    - '(?i)^\s*(how to|steps?\b|procedure|instructions?)'
    - '(?i)\b(setting|settings)\s*:?\s*$'
    - '(?i)^\s*(cách|các bước|quy trình|hướng dẫn)'
  chunk_type_rules:
    - {chunk_type: pinout, applies_to: [figure, overview, table], title: '(?i)\bpin\s*(out|assignment|definition)|\bport table\b|sơ đồ chân'}
    - {chunk_type: wiring, applies_to: [figure, overview], title: '(?i)wiring|connection diagram|\b(input|output)\b.*\bdiagram\b|\bdiagram\b.*\b(input|output)\b|đấu dây|sơ đồ (nối|kết nối)', content: '(?i)\b(connection|wiring) diagram\b|sơ đồ đấu dây'}
    - {chunk_type: dimension, applies_to: [figure, overview], title: '(?i)dimension|kích thước'}
    - {chunk_type: alarm, applies_to: [overview, table], title: '(?i)\balarm|troubleshoot|\berror\b|báo lỗi|báo động|xử lý lỗi', content: '(?i)\bthe cause is\b|\bnguyên nhân\b'}
    - {chunk_type: spec, applies_to: [overview, table], title: '(?i)specification|thông số kỹ thuật|hardware summary'}
  control_interface_terms:
    pulse_train: ['Pulse Train']
    ethercat: ['EtherCAT']
    mechatrolink: ['Mechatrolink']
  spec_attribute_terms:
    dimension: ['dimension', 'dimensions', 'kích thước']
    monitor_size: ['monitor', 'screen size', 'màn hình']
    max_axis: ['number of axes', 'axis count', 'số trục']
    io: ['I/O', 'input', 'output', 'ngõ vào', 'ngõ ra']
    loop_type: ['open loop', 'closed loop']
    look_ahead: ['look-ahead', 'look ahead']
    spindle: ['spindle', 'trục chính']
    rtcp: ['RTCP']
    ports: ['USB', 'RS485', 'RS232', 'MPG', 'port', 'cổng']
  # I-46 (2026-11-13, thử nghiệm sau CP-I46): THÊM scope theo nội dung, cộng vào scope theo mục của manifest (không
  # bớt). Tiêu đề xét từ cấp 2 trở xuống (tên phần lớn như "PART 2: WIRING - CONNECTION - SETTING" gộp nhiều việc).
  # Không dùng "press", "screen", "program" làm dấu hiệu vận hành: thủ tục cài tham số cũng có các từ này.
  scope_title_min_level: 2
  scope_content_rules:
    - scope: configuration
      title: '(?i)\b(setting|settings|parameters?|configur\w*|set ?up)\b|cài đặt|cấu hình|tham số'
      content: '(?i)\bPARAMETER screen\b|\buser password\b|\bparameter (status )?description\b|\bconfigure the (following )?parameters?\b|\bset the parameters?\b'
    - scope: operation
      content: '(?i)\boperat(ing|ion) instructions?\b|\bMANUAL MODE\b|\bAUTO mode\b|\bCYCLE START\b|\bprocess \(M\d+\)|\bwhen (the )?command M\d+ is (called|executed)\b|hướng dẫn vận hành'
    - scope: maintenance
      content: '(?i)\breports? an error\b|\bthe cause (is|of)\b|\btroubleshoot\w*'
    - scope: installation
      chunk_types: [wiring, pinout, dimension]
  # Nhãn trong hình giữ làm từ khóa (ngoài code_patterns): giá trị có đơn vị, mã chữ in hoa + số, ký hiệu chân.
  figure_label_patterns:
    - '^\d+(\.\d+)?\s?(mm|cm|m|V|VAC|VDC|A|mA|W|kW|Hz|kHz|ms|s|°C)$'
    - '^(AC|DC)[-\s]?\d+(\.\d+)?\s?V$'
    - '^[A-Z]{1,6}[-_]?\d{1,3}[+-]?$'
    - '^(FG|GND|COM|PE|NC|NO|NPN|PNP|\+?24V|0V|[ABZ][+-])$'
