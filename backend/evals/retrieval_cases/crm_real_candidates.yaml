# 16 câu khách hàng hỏi thật, lấy từ dữ liệu CRM (Toma chắt lọc, 2026-11-25). Ứng viên cho bộ vàng v1 (kế hoạch §9, GD1).
# TRẠNG THÁI: CHƯA duyệt. Nhãn dưới đây là ĐỀ XUẤT của Claude để QS xem lại, không phải nhãn đã chốt:
#   - expected_intent, expected_route, expected_domain: đề xuất; QS sửa nếu khác ý nghiệp vụ.
#   - Câu gắn tag `can_gan_nhan_chunk`: có thể trả lời bằng tài liệu hiện có (xem `tim_thay_trong_tai_lieu`) nhưng CHƯA có chunk đúng
#     và fact vàng → chưa dùng được cho đo tra cứu/sinh câu trả lời. Khi QS gắn nhãn xong thì chuyển câu sang gold_v1.yaml.
#   - Câu `expect_abstain: true`: đã tìm từ khóa trong doc_chunks_v2 (2026-11-25) và KHÔNG thấy nội dung liên quan.
#   - Câu chỉ chấm định tuyến (báo giá, mua bán, hợp tác): không có chunk đúng; đúng là chuyển người (route handoff).
# Ẩn danh: số điện thoại, địa chỉ web, tên công ty của khách đã thay bằng <sdt>, <url>, <công ty>. Mô tả nguyên văn đã giữ sai chính tả/viết tắt của khách.
# Chia split theo cụm: RC01 và RC04 cùng ý (đổi thông số về home) nên cùng `dev` để không rò rỉ giữa dev và test.
# Công cụ: evals/run_retrieval_eval.py --cases evals\retrieval_cases\crm_real_candidates.yaml --mode routing
source_runs: []
