  - id: RC05
    question: |-
      Tôi đang tìm hiểu và có ý định sử dụng bộ điều khiển QS Astro 6V cho dự án chế tạo máy phay CNC. Qua tìm hiểu, tôi được biết Astro 6V là dòng controller chạy EtherCAT, hỗ trợ tối đa 6 trục, tích hợp FPGA và có các tính năng nâng cao. Tôi có một số câu hỏi kỹ thuật cần được Quý Công ty giải đáp để có thể đánh giá khả năng tích hợp với hệ thống hiện tại của tôi.

      1. Về Spindle Drive:
      Hiện tại tôi đang sử dụng hệ thống truyền động trục chính với các thông tin cụ thể như sau:
      Spindle Motor: Yaskawa USAJKM-30-MN31 (5.5/3.7 kW, 12.000/10.000 rpm, 37/28 A, 200V)
      Inverter: Yaskawa VS-626M5 (200V Class, 3-phase, 15 kW)
      Converter: Yaskawa VS-656MR5 (200V Class, 3-phase, 11 kW)
      Các thiết bị này hiện đang nhận tín hiệu điều khiển analog (0-10V) hoặc pulse train. Khi chuyển sang bộ điều khiển QS Astro 6V (EtherCAT), tôi có bắt buộc phải thay spindle drive sang loại hỗ trợ EtherCAT hay không? Hay controller vẫn có thể điều khiển spindle qua tín hiệu analog/pulse thông qua module I/O mở rộng? Tôi muốn hiểu rõ yêu cầu kỹ thuật này để có phương án phù hợp.

      2. Về Motor thay dao (ATC):
      Motor thay dao của tôi hiện đang dùng mặt bích 120mm, đi kèm một drive riêng và được điều khiển thông qua PLC (không qua controller CNC). Câu hỏi của tôi là:
      Tôi có nên chuyển motor thay dao này sang chạy trực tiếp bằng EtherCAT thông qua controller QS Astro 6V không?
      Nếu giữ nguyên drive cũ và điều khiển qua PLC, controller QS Astro 6V có hỗ trợ giao tiếp với PLC bên ngoài để phối hợp thay dao không? (Ví dụ qua I/O, Modbus TCP, hoặc EtherCAT master-slave?)

      3. Về việc gửi drive Inovance để test và link với controller:
      Tôi đang sử dụng servo drive Inovance SV660NS012I (EtherCAT) cho các trục XYZ. Để đảm bảo khả năng tương thích và được hỗ trợ tốt nhất, tôi có cần gửi drive Inovance đến Quý Công ty để test và link với bộ điều khiển QS Astro 6V không? Nếu có, quy trình gửi mẫu và thời gian test dự kiến là bao lâu? Chi phí test (nếu có) là bao nhiêu?

      4. Về tài liệu và hỗ trợ kỹ thuật:
      Quý Công ty có thể cung cấp cho tôi:
      Tài liệu kỹ thuật (datasheet, manual) của QS Astro 6V bằng tiếng Việt hoặc tiếng Anh?
      Danh sách các dòng servo drive EtherCAT đã được test và tương thích chính thức với Astro 6V?
      Chính sách hỗ trợ kỹ thuật (qua điện thoại, remote, hoặc onsite) trong quá trình tích hợp?
    source: real
    split: test
    domain: product_catalog
    models: []                       # khách viết "Astro 6V"; registry có 6AV/6AH → QS xác nhận có phải 6AV/6AH không (kiểm tra trích thực thể)
    tags: ["khach_hang", "nhieu_y", "dai", "sai_ten_model", "tu_van_truoc_ban", "can_gan_nhan_chunk"]
    expected_intent: ["lookup.product_info", "lookup.product_catalog", "handoff.human"]
    expected_route: clarify          # tên model "6V" không khớp registry (đề xuất; QS quyết hỏi lại hay đoán 6AV)
    tim_thay_trong_tai_lieu: "catalog có ATC (9 chunk), pulse train (27), PLC (25); KHÔNG thấy Inovance/SV660/Modbus/danh sách drive tương thích; chính sách hỗ trợ/chi phí test cần người"
    expected: []
