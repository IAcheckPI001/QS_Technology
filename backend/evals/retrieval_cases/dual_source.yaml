# Bộ câu "hai nguồn" (R-1 giai đoạn A5; Claude soạn 2026-11-14, CHỜ TOMA DUYỆT). Câu hỏi thông số/đặc điểm của
# F54, F86 mà câu trả lời nằm ở tài liệu kỹ thuật (hoặc ở cả tài liệu kỹ thuật lẫn catalog). Bước phân tích
# thường xếp các câu này là lookup.product_info → chỉ tìm catalog → thiếu nguồn (như D01, Q12, D39). Dùng để đo luật
# RT-1 (tìm thêm technical_docs): so r0 ↔ r1. `expected` = chunk tài liệu kỹ thuật; chunk catalog trả lời được một
# phần nằm ở `acceptable`. HC1–HC4 = đối chứng: câu trả lời chỉ có ở catalog, RT-1 không được làm tụt hạng.
# Nhãn chunk catalog cập nhật 2026-11-25 theo run qs_catalog/curated-b2 (72 chunk): `section_path` bảng đổi; chunk trọn bộ đổi nội dung
# (bỏ khỏi acceptable khi đáp án nằm ở trang riêng model, trừ K02/K05/K16); lát theo model thêm vào acceptable cho câu nêu model
# và có chunk bảng đúng (tự động theo nhóm hàng, chưa người duyệt).
