# Bộ câu chỉ chấm ĐỊNH TUYẾN của bước phân tích (R-1 giai đoạn A2; Claude soạn 2026-11-14, CHỜ TOMA DUYỆT).
# Không gán chunk đúng: chấm intent, route, domain (`--mode routing`). Mỗi nhóm = một cặp intent dễ nhầm
# (tag `cap:<a>~<b>`), cân hai phía. `split`: `dev` = dùng để sửa luật/prompt; `test` = chỉ để đo, không dùng
# để soạn ví dụ mẫu. `expected_intent` nhiều giá trị = chấp nhận một trong các intent; `expected_domain` dạng
# danh sách = câu trả lời có ở nhiều nguồn, tìm ở một trong các domain là đúng.
# Câu hướng dẫn không nêu model (tag `khong_model`): lượt 1 mong đợi hỏi lại model, lượt 2 (đã có model của
# `models`) mong đợi tra cứu. Sửa file này bằng cách sửa script sinh (LOG website-qa 2026-11-14) hoặc sửa tay.
